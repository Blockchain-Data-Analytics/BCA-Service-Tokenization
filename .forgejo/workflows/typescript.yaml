name: TypeScript packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: npm ci / check / audit
    runs-on: nixos-amd64
    container:
      image: code.blockchain-applied.com/bca/ci-cardano:1.0.0
      credentials:
        username: ci_bca
        password: ${{ secrets.PAT }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository code
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: false

      # @bca/evolution-sdk comes from the BCA Forgejo npm registry (scope
      # mapping in .npmrc); only the token is injected here.
      - name: Configure registry auth
        env:
          NPM_TOKEN: ${{ secrets.PAT }}
        run: npm config set "//code.blockchain-applied.com/api/packages/BCA/npm/:_authToken" "${NPM_TOKEN}"

      # Every non-workspace package must come from a registry tarball with an
      # integrity hash: git dependencies fail in CI and pin nothing reproducible.
      - name: lockfile sources are pinned registry tarballs
        run: |
          jq -r '.packages | to_entries[]
            | select(.key != "" and (.value.link | not) and (.key | startswith("packages/") and (contains("/node_modules/") | not) | not))
            | select((.value.resolved // "" | startswith("https://") | not) or (.value.integrity | not))
            | "\(.key)\t\(.value.resolved // "-")"' package-lock.json > /tmp/unpinned.txt
          if [ -s /tmp/unpinned.txt ]; then
            echo "::error::package-lock.json has dependencies without a registry tarball + integrity:"
            cat /tmp/unpinned.txt
            exit 1
          fi

      - name: npm ci
        run: npm ci --no-fund

      - name: type-check workspaces (tsc --noEmit)
        run: npm run check

      - name: npm audit (root workspace)
        run: npm audit --audit-level=moderate
